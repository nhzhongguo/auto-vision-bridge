# Codex (OpenAI) 接入配置
# 把这 5 行合并进 %USERPROFILE%\.codex\config.toml 的末尾（如果没有 [mcp_servers] 段就新建）
# 空字符串 = 未配置，不影响使用；填入 Key 即可启用对应提供商
[mcp_servers.glm-vision]
command = "node"
args = ["<你的项目绝对路径>/glm-vision-mcp/dist/index.js"]
env = { ZHIPU_API_KEY = "YOUR_ZHIPU_API_KEY", SILICONFLOW_API_KEY = "", GROQ_API_KEY = "", OPENROUTER_API_KEY = "", GITHUB_TOKEN = "", GEMINI_API_KEY = "", CLOUDFLARE_API_TOKEN = "", CLOUDFLARE_ACCOUNT_ID = "" }
